# Appium Server Configuration
appium.server.url=http://127.0.0.1:4723/

# Android Configuration
android.app.path=/apps/login-app.apk
android.app.package=com.example.loginapp
android.app.activity=.MainActivity
android.automation.name=UiAutomator2
android.uiautomator2.server.launch.timeout=120000
android.adb.exec.timeout=120000
android.app.wait.duration=45000
android.install.timeout=120000
android.auto.grant.permissions=true
android.disable.window.animation=true

# iOS Configuration
ios.bundle.id=com.example.loginapp
ios.automation.name=XCUITest

# General Configuration
implicit.wait=10
explicit.wait=15

# Database Configuration
db.url=jdbc:mysql://localhost:3306/testdb
db.username=root
db.password=password
db.driver=com.mysql.cj.jdbc.Driver
